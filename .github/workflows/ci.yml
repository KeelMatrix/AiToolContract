name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: Build and test (${{ matrix.os }}, MEAI ${{ matrix.abstractions }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            abstractions: 10.0.0
          - os: ubuntu-latest
            abstractions: 10.11.0
          - os: windows-latest
            abstractions: 10.0.0
          - os: windows-latest
            abstractions: 10.11.0
          - os: macos-latest
            abstractions: 10.0.0
          - os: macos-latest
            abstractions: 10.11.0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify package gate control flow
        shell: pwsh
        run: ./tests/PackageGate.Tests.ps1

      - name: Restore
        run: dotnet restore KeelMatrix.AiToolContract.sln --configfile NuGet.config -p:AiToolContractAbstractionsVersion=${{ matrix.abstractions }}

      - name: Build
        run: dotnet build KeelMatrix.AiToolContract.sln --configuration Release --no-restore -p:AiToolContractAbstractionsVersion=${{ matrix.abstractions }}

      - name: Verify symbol metadata and built source paths
        shell: pwsh
        run: ./tests/SymbolMetadata.Tests.ps1 -VerifyBuildOutput

      - name: Test
        run: dotnet test KeelMatrix.AiToolContract.sln --configuration Release --no-build --no-restore -p:AiToolContractAbstractionsVersion=${{ matrix.abstractions }}

      - name: Test the netstandard2.0 library asset
        run: dotnet test tests/KeelMatrix.AiToolContract.Tests/KeelMatrix.AiToolContract.Tests.csproj --configuration Release --no-restore -p:AiToolContractAbstractionsVersion=${{ matrix.abstractions }} -p:AiToolContractTestLibraryFramework=netstandard2.0

  quality:
    name: Format and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeelMatrix.AiToolContract.sln --configfile NuGet.config

      - name: Verify formatting
        run: dotnet format KeelMatrix.AiToolContract.sln --verify-no-changes --no-restore

      - name: Verify hidden child PowerShell launches
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1 -SelfTest

      - name: Verify repository child PowerShell launches
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1

      - name: Verify release contract helper
        shell: pwsh
        run: ./tests/Validate-Release.Tests.ps1

      - name: Verify IDE artifact ignore rules and negative controls
        shell: pwsh
        run: |
          ./scripts/Test-IdeArtifactIgnores.ps1
          ./tests/IdeArtifactIgnores.Tests.ps1

      - name: Verify vulnerability audit contract and casing policy
        shell: pwsh
        run: ./tests/VulnerabilityAudit.Tests.ps1

      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/Invoke-VulnerabilityAudit.ps1 -Solution ./KeelMatrix.AiToolContract.sln -ConfigFile ./NuGet.config

  package:
    name: Pack and inspect archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run package gate
        shell: pwsh
        run: ./scripts/Verify-Package.ps1

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-gate
          path: artifacts/package-gate
          if-no-files-found: error

  consumer-smoke:
    name: Package consumer smoke (${{ matrix.os }})
    needs: package
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-gate
          path: artifacts/package-gate

      - name: Restore, build, and run clean consumers from exact artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($abstractionsVersion in @('10.0.0', '10.11.0')) {
            ./scripts/Invoke-PackageConsumerSmoke.ps1 `
              -PackagePath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-gate/KeelMatrix.AiToolContract.0.1.0.nupkg') `
              -Version '0.1.0' `
              -AbstractionsVersion $abstractionsVersion
            if ($LASTEXITCODE -ne 0) { throw 'Package consumer verification failed.' }
          }
