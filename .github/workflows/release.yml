name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Validate and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release-version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore from NuGet.org
        run: dotnet restore KeelMatrix.AiToolContract.sln --configfile NuGet.config --no-cache --force

      - name: Build Release
        run: dotnet build KeelMatrix.AiToolContract.sln --configuration Release --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Test Release
        run: dotnet test KeelMatrix.AiToolContract.sln --configuration Release --no-build --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Run package gate
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -Version '${{ steps.release-version.outputs.version }}' -PackageReleaseNotes 'Initial public release.'

      - name: Validate release contract
        shell: pwsh
        run: ./scripts/Validate-Release.ps1 -Version '${{ steps.release-version.outputs.version }}' -Tag '${{ github.ref_name }}' -PackageDirectory ./artifacts/package-gate -RequireFinalizedChangelog

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-packages
          path: ./artifacts/package-gate
          if-no-files-found: error

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push package to NuGet.org
        shell: pwsh
        run: |
          $version = '${{ steps.release-version.outputs.version }}'
          $nupkg = "./artifacts/package-gate/KeelMatrix.AiToolContract.$version.nupkg"
          $snupkg = "./artifacts/package-gate/KeelMatrix.AiToolContract.$version.snupkg"
          dotnet nuget push $nupkg --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push $snupkg --source https://api.nuget.org/v3/index.json --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/package-gate/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
